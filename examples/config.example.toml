# cann-llm 示例配置
# 用法：cann-llm-server --config examples/config.example.toml
# 环境变量覆盖：CANN_LLM_MODEL__MODEL_DIR / CANN_LLM_SERVER__PORT ...
# 优先级：命令行 > 环境变量 > 本文件 > 内置默认值

[model]
# 模型目录（需含 omc / SubGraph_0.weight / embedding / tokenizer / json）
model_dir = "/storage/Users/currentUser/work/llm/models/rebuilt"
model_id  = "qwen2.5-1.5b"
backend   = "cann"
chat_template = "chatml"
system_prompt = "You are Qwen, created by Alibaba Cloud. You are a helpful assistant."

max_tokens = 256
temperature = 0.7
top_k = 20
top_p = 0.95
repetition_penalty = 1.1
context_length = 2048   # 仅用于 /v1/models 展示；本服务不设输入长度上限

[server]
host = "127.0.0.1"
port = 8000
max_queue = 8
queue_timeout_s = 120.0
request_timeout_s = 600.0
cors_allow_origin = "*"
# api_key = "sk-xxx"     # 非空则要求 Authorization: Bearer sk-xxx

# True  = 本服务实现不了的字段一律 400
# False（默认）= 忽略并在响应头 X-Cann-Llm-Ignored-Fields 回报
# 默认宽容是有意的：多数客户端即使普通聊天也会带 tools，一律报错会让它们用不了。
# reject_unsupported = false

# 说明：HTTP 层按 OpenAI 标准返回 tool_calls，由客户端执行，这里没有开关

# ---------------------------------------------------------------------------
# agent 循环（只作用于 CLI 交互式对话；HTTP 层不执行工具）
# ---------------------------------------------------------------------------
[agent]
max_steps = 4            # 最多迭代几轮（含最后一轮强制收尾）
# 说明：工具返回值不做任何截断 —— 返回多少就给模型多少。
# 需要控制长度请在工具实现里自己分块或摘要。
# 说明：框架不往 prompt 里追加任何指令（不写「你必须调用工具」之类的话）。
# 想让模型更爱用工具，请写在调用方自己的 system prompt 里。
